<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ppaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#ppaBg)" stroke="#27272a" stroke-width="2"/>
  
  <!-- Tri-color PPA Archival Monogram -->
  <g font-family="'Bebas Neue', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="32" text-anchor="middle">
    <text x="32" y="41">
      <tspan fill="#EF4444">P</tspan>
      <tspan fill="#06B6D4">P</tspan>
      <tspan fill="#F59E0B">A</tspan>
    </text>
  </g>

  <!-- Museum Archival Indicator Bar / Dots -->
  <circle cx="21" cy="51" r="2" fill="#EF4444"/>
  <circle cx="32" cy="51" r="2" fill="#06B6D4"/>
  <circle cx="43" cy="51" r="2" fill="#F59E0B"/>
</svg>
